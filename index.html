<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8f1" />
  <meta name="description" content="Atlas 3D interaktif untuk belajar anatomi Modul Kardiovaskular, dari data anatomi asli BodyParts3D." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Pasang tema sebelum halaman tampil (hindari kedip putih di mode gelap).
    (function () {
      var t = null
      try { t = localStorage.getItem('atlas3d-tema') } catch (e) {}
      var gelap = t === 'gelap' || (t !== 'terang' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = gelap ? 'dark' : 'light'
    })()
  </script>
  <title>Atlas 3D · Anatomi Modul Kardiovaskular</title>
</head>
<body class="home">
  <div id="app"></div>
  <script type="module" src="/src/home.js"></script>
</body>
</html>
